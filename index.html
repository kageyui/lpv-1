<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>資料ビューア</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1e2420;--sub:#5d6862;--line:#d9ddd6;--accent:#2f6b4f;--hl:#e6efe9;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#141816;--card:#1c211e;--ink:#e6ebe7;--sub:#9aa69f;--line:#2e3632;--accent:#7cc4a0;--hl:#22302a;--err:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:2;display:flex;gap:6px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--card);border-bottom:1px solid var(--line)}
button,input{font:inherit;color:inherit}
.bar button,.bar input{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px}
#pick{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pno{width:4.2em;text-align:right}.of{color:var(--sub);font-size:.85rem;white-space:nowrap}
#docs{padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:var(--card);border-bottom:1px solid var(--line)}
#q{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.list{max-height:60vh;overflow:auto;margin-top:8px}.list h3{font-size:.8rem;color:var(--sub);margin:12px 4px 4px}
.list button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 6px;border-radius:6px}
.list button:hover,.list button[aria-current="true"]{background:var(--hl)}.list .n{margin-left:auto;color:var(--sub);font-size:.8rem;flex:none}
main{max-width:1100px;margin:0 auto;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(8px,env(safe-area-inset-left,0px))}
.pg{margin:10px 0 18px}.lab{font-size:.8rem;color:var(--sub);margin:0 0 4px 2px}
.pg img{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:4px;min-height:200px}
.msg{padding:30px 6px;color:var(--sub)}.more{text-align:center;margin:10px 0 30px}.more button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 16px}
#lock{max-width:420px;margin:12vh auto 0;padding:24px 20px;background:var(--card);border:1px solid var(--line);border-radius:14px}
#lock h1{font-size:1.1rem;margin:0 0 8px}#lock p{color:var(--sub);font-size:.9rem;margin:0 0 14px}
#lock input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:10px}
#lock button{width:100%;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--card);font-weight:700}
#err{color:var(--err);font-size:.85rem;min-height:1.4em}
#forget{border:0;background:none;color:var(--sub);text-decoration:underline;padding:0;font-size:.8rem}
</style></head><body>
<div id="lock" hidden><h1>資料ビューア</h1><p>合言葉を入れてください。この端末では、しばらく聞かれません。</p>
<form id="lf"><input id="pw" type="password" autocomplete="current-password" placeholder="合言葉" aria-label="合言葉"><div id="err"></div><button>開く</button></form></div>
<div id="app" hidden>
<div class="bar"><button id="pick" aria-expanded="false">資料を選ぶ</button><button id="prev" aria-label="前のページ">‹</button><input id="pno" type="number" min="1" inputmode="numeric" aria-label="ページ"><span class="of" id="of"></span><button id="next" aria-label="次のページ">›</button></div>
<div id="docs" hidden><input id="q" type="search" placeholder="資料名・科目で絞り込む" autocomplete="off"><div class="list" id="list"></div>
<p style="margin:10px 4px 0"><button id="forget">この端末で合言葉を忘れる</button></p></div>
<main id="view"><p class="msg">資料を選んでください。</p></main><div class="more"><button id="more">次の2ページも表示</button></div></div>

const $=s=>document.querySelector(s),b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const u64=a=>{let s="";new Uint8Array(a).forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nz=s=>String(s||"").normalize("NFKC").toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/\s/g,"");
let K=null,DOCS=[],cur={b:null,p:1,last:0};
async function dec(key,buf){buf=new Uint8Array(buf);return crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},key,buf.slice(12))}
async function unlockRaw(raw){K=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);DOCS=JSON.parse(new TextDecoder().decode(await dec(K,b64(CAT))));DOCS.forEach(d=>d._k=nz((d.sub||"")+" "+d.t))}
async function fromPw(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.trim()),"PBKDF2",false,["deriveKey"]);
 const kek=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);return dec(kek,b64(WRAP))}
function save(raw){try{localStorage.setItem("gk",JSON.stringify({k:u64(raw),t:Date.now()}))}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem("gk")||"null");if(o&&Date.now()-o.t<DAYS*864e5)return b64(o.k)}catch(e){}return null}
async function start(){const raw=load();if(raw){try{await unlockRaw(raw);save(raw);return open_()}catch(e){}}$("#lock").hidden=false;$("#pw").focus()}
$("#lf").addEventListener("submit",async e=>{e.preventDefault();$("#err").textContent="確かめています…";try{const raw=await fromPw($("#pw").value);await unlockRaw(raw);save(raw);$("#lock").hidden=true;open_()}catch(x){$("#err").textContent="合言葉が違います"}});
$("#forget").addEventListener("click",()=>{try{localStorage.removeItem("gk")}catch(e){}location.reload()});
const cache=new Map();
async function img(b,p){const k=b.id+"/"+p;if(!cache.has(k))cache.set(k,fetch(REPOS[b.r]+"p/"+b.id+"/"+p).then(r=>{if(!r.ok)throw new Error("読み込み "+r.status);return r.arrayBuffer()}).then(a=>dec(K,a)).then(x=>URL.createObjectURL(new Blob([x],{type:"image/webp"}))).catch(e=>{cache.delete(k);throw e}));return cache.get(k)}
async function draw(b,p,el){const lab=document.createElement("div");lab.className="lab";lab.textContent=b.t+"　p."+p;const im=document.createElement("img");im.alt=b.t+" p."+p;el.replaceChildren(lab,im);
 try{im.src=await img(b,p)}catch(e){el.innerHTML='<p class="msg">読み込めませんでした（'+esc(e.message)+'）。電波を確かめて、もう一度開いてください。</p>'}
 if(p<b.n)img(b,p+1).catch(()=>{})}
function show(id,p,push=true){const b=DOCS.find(x=>x.id===id);if(!b)return toggle(true);p=Math.max(1,Math.min(b.n,p|0||1));cur={b,p,last:p};
 $("#pick").textContent=(b.sub?b.sub+"　":"")+b.t;$("#pno").value=p;$("#of").textContent="/ "+b.n;const v=$("#view");v.replaceChildren();
 const el=document.createElement("section");el.className="pg";v.append(el);draw(b,p,el);if(push){const h="#"+b.id+"-p"+p;if(location.hash!==h)history.replaceState(null,"",h)}scrollTo(0,0)}
function more(){const b=cur.b;if(!b)return;for(let i=0;i<2;i++){const p=cur.last+1;if(p>b.n)break;cur.last=p;const el=document.createElement("section");el.className="pg";$("#view").append(el);draw(b,p,el)}}
function list(){const q=nz($("#q").value);let h="",last=null,c=0;for(const d of DOCS){if(q&&!d._k.includes(q))continue;if(++c>400)break;if(d.sub!==last){last=d.sub;h+=`<h3>${esc(d.sub)}</h3>`}
 h+=`<button data-id="${d.id}" aria-current="${cur.b===d}"><span>${esc(d.t)}</span><span class="n">${d.n}頁</span></button>`}$("#list").innerHTML=h||'<p class="msg">見つかりませんでした</p>'}
function toggle(o){$("#docs").hidden=!o;$("#pick").setAttribute("aria-expanded",o);if(o)list()}
function fromHash(){const m=decodeURIComponent(location.hash).match(/^#([bds][0-9a-f]+)(?:-p(\d+))?$/);if(m&&DOCS.some(d=>d.id===m[1]))show(m[1],+(m[2]||1),false);else if(!cur.b)toggle(true)}
function open_(){$("#app").hidden=false;fromHash()}
$("#pick").addEventListener("click",()=>toggle($("#docs").hidden));$("#q").addEventListener("input",list);
$("#list").addEventListener("click",e=>{const b=e.target.closest("button[data-id]");if(b){toggle(false);show(b.dataset.id,1)}});
$("#pno").addEventListener("change",e=>cur.b&&show(cur.b.id,+e.target.value));$("#prev").addEventListener("click",()=>cur.b&&show(cur.b.id,cur.p-1));
$("#next").addEventListener("click",()=>cur.b&&show(cur.b.id,cur.p+1));$("#more").addEventListener("click",more);
/* 横にフリックしてページをめくる（11-11 本人「フリックで横のページに行けるようにしたい」）。左へ払うと次、右へ払うと前。拡大中・2本指のときはめくらない */
(()=>{let sx=0,sy=0,st=0,ok=false;const v=$("#view");
v.addEventListener("touchstart",e=>{ok=e.touches.length===1&&!(window.visualViewport&&visualViewport.scale>1.05);if(ok){sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now()}},{passive:true});
v.addEventListener("touchmove",e=>{if(e.touches.length>1)ok=false},{passive:true});
v.addEventListener("touchend",e=>{if(!ok||!cur.b)return;ok=false;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
 if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5||Date.now()-st>800)return;const np=cur.p+(dx<0?1:-1);if(np<1||np>cur.b.n)return;
 v.style.transition="none";v.style.transform="translateX("+(dx<0?24:-24)+"px)";v.style.opacity=".4";show(cur.b.id,np);scrollTo(0,0);
 requestAnimationFrame(()=>{v.style.transition="transform .18s,opacity .18s";v.style.transform="";v.style.opacity=""})},{passive:true});
addEventListener("keydown",e=>{if(!cur.b||/INPUT|TEXTAREA/.test((e.target.tagName||"")))return;if(e.key==="ArrowRight")show(cur.b.id,cur.p+1);else if(e.key==="ArrowLeft")show(cur.b.id,cur.p-1)});})();addEventListener("hashchange",()=>K&&fromHash());
start();
